# Single-node MongoDB replica set (transactions require a replica set).
# Usage:
#   docker compose up -d
#   MONGODB_URI="mongodb://localhost:27017/feedants?replicaSet=rs0&directConnection=true" npm run seed
#   MONGODB_URI="mongodb://localhost:27017/feedants?replicaSet=rs0&directConnection=true" npm run dev
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30

volumes:
  mongo-data:
